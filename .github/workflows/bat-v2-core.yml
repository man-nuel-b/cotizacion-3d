name: BAT V2 - Integridad del núcleo
on:
  push:
    branches:
      - rebuild/bat-core-v2
    paths:
      - 'rebuild/**'
      - '.github/workflows/bat-v2-core.yml'
  pull_request:
    paths:
      - 'rebuild/**'
      - '.github/workflows/bat-v2-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis JavaScript
        run: |
          for f in rebuild/core/*.js rebuild/main.js rebuild/catalog-view.js rebuild/container-visual.js; do node --check "$f"; done
      - name: Ejecutar pruebas del nuevo núcleo
        run: node --test rebuild/tests/*.test.cjs

  browser-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Three.js y Chromium para integración 3D
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 three@0.128.0
          npx playwright install --with-deps chromium
      - name: Probar clic en pared, cubicación, presupuesto y rollback en Chromium
        run: node --test rebuild/tests/browser-v2.spec.cjs
      - name: Adjuntar diagnóstico si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bat-v2-browser-diagnostic
          path: /tmp/bat-v2-browser-diagnostic.png
          if-no-files-found: ignore
