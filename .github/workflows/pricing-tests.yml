name: Validar costos APU

on:
  push:
    branches: [main]
    paths:
      - 'pricing-integrity-v1.js'
      - 'construction-apu-rules-v1.js'
      - 'apu-*.js'
      - 'interior-production-v1.js'
      - 'commercial-audit-v1.js'
      - 'summary-panel-toggle.js'
      - 'tests/**'
      - '.github/workflows/pricing-tests.yml'
  pull_request:
    paths:
      - 'supabase-3d-bom-bridge.js'
      - 'pruebas.html'
      - 'tests/**'
      - '.github/workflows/pricing-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pricing-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar pruebas financieras
        run: node --test tests/*.test.cjs

  browser-window-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chromium y dependencias de pruebas
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 three@0.128.0
          npx playwright install --with-deps chromium
      - name: Probar selector de cara y objeto 3D en Chromium
        run: node --test tests/browser-window-face.spec.cjs
      - name: Adjuntar captura de diagnóstico si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cubikeitor-window-browser-diagnostic
          path: /tmp/cubikeitor-window-smoke.png
          if-no-files-found: ignore
