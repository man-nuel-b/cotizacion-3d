name: Publicar BAT CUBIKEITOR en navegador
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'rebuild/**'
      - '.github/workflows/preview-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar interfaz
        run: test -s index.html
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
