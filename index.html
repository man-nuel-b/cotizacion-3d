<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Sitio temporalmente no disponible</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#020617;color:#e2e8f0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.card{width:min(560px,100%);padding:42px 32px;border:1px solid rgba(148,163,184,.18);border-radius:24px;background:rgba(15,23,42,.92);box-shadow:0 24px 80px rgba(0,0,0,.35);text-align:center}.icon{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;background:#f59e0b;color:#0f172a;font-size:30px;font-weight:900}h1{margin:0;font-size:clamp(24px,5vw,34px);line-height:1.1}p{margin:14px auto 0;color:#94a3b8;line-height:1.65;max-width:430px}.badge{display:inline-flex;margin-top:22px;padding:9px 14px;border-radius:999px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.22);color:#fbbf24;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">■</div>
    <h1>Sitio temporalmente no disponible</h1>
    <p>El configurador se encuentra temporalmente fuera de línea.</p>
    <div class="badge">Acceso suspendido</div>
  </main>
</body>
</html>
