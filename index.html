<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModularBox 3D - Configurador con Snapping y Cubicación Sodimac</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Three.js y OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #canvas-container { width: 100%; height: 100%; min-height: 450px; position: relative; }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    
    @media print {
      body * { visibility: hidden; }
      #printable-quote, #printable-quote * { visibility: visible; }
      #printable-quote { position: absolute; left: 0; top: 0; width: 100%; display: block !important; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden">

  <!-- Header / Navbar -->
  <header class="bg-slate-900 text-white px-6 py-3 flex justify-between items-center shadow-md z-10 no-print">
    <div class="flex items-center space-x-3">
      <div class="bg-amber-500 text-slate-900 p-2 rounded-lg font-bold text-xl">
        <i class="fa-solid fa-cubes-stacked"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-tight flex items-center gap-2">
          ModularBox 3D
          <span class="bg-red-600 text-white text-[10px] uppercase font-extrabold px-2 py-0.5 rounded-full flex items-center gap-1">
            <i class="fa-solid fa-store"></i> Sync Sodimac
          </span>
        </h1>
        <p class="text-xs text-slate-400">Diseñador 3D con Snapping a Paredes y Cubicación de Materiales</p>
      </div>
    </div>

    <!-- Quick Controls -->
    <div class="flex items-center space-x-4 text-sm">
      <button onclick="syncSodimacPrices()" id="btn-sync-sodimac" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 text-amber-400 font-semibold text-xs transition flex items-center space-x-1.5">
        <i class="fa-solid fa-rotate text-amber-400" id="sync-icon"></i>
        <span>Actualizar Precios Sodimac</span>
      </button>

      <button onclick="toggleModal('margin-modal')" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300 transition text-xs">
        <i class="fa-solid fa-percent text-amber-400 mr-1"></i> Margen: <span id="margin-display-head">25%</span>
      </button>

      <button onclick="openQuoteModal()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold px-4 py-1.5 rounded-lg transition shadow-sm flex items-center space-x-1.5 text-xs">
        <i class="fa-solid fa-file-invoice-dollar"></i>
        <span>Ver Cotización</span>
      </button>
    </div>
  </header>

  <!-- Main Work Area -->
  <div class="flex-1 flex overflow-hidden no-print">

    <!-- Left Controls Panel -->
    <aside class="w-96 bg-white border-r border-slate-200 flex flex-col shadow-lg z-10">
      
      <!-- Navigation Tabs -->
      <div class="flex border-b border-slate-200 bg-slate-50">
        <button onclick="switchTab('config')" id="tab-btn-config" class="flex-1 py-3 px-2 text-xs font-semibold text-amber-600 border-b-2 border-amber-500 flex items-center justify-center space-x-1">
          <i class="fa-solid fa-sliders"></i> <span>Módulo</span>
        </button>
        <button onclick="switchTab('placement')" id="tab-btn-placement" class="flex-1 py-3 px-2 text-xs font-semibold text-slate-500 hover:text-slate-700 flex items-center justify-center space-x-1">
          <i class="fa-solid fa-hand-pointer"></i> <span>Colocar Objetos</span>
        </button>
        <button onclick="switchTab('finishes')" id="tab-btn-finishes" class="flex-1 py-3 px-2 text-xs font-semibold text-slate-500 hover:text-slate-700 flex items-center justify-center space-x-1">
          <i class="fa-solid fa-paint-roller"></i> <span>Terminaciones</span>
        </button>
        <button onclick="switchTab('bom')" id="tab-btn-bom" class="flex-1 py-3 px-2 text-xs font-semibold text-slate-500 hover:text-slate-700 flex items-center justify-center space-x-1">
          <i class="fa-solid fa-list-check"></i> <span>BOM Exacto</span>
        </button>
      </div>

      <!-- Tab Content Area -->
      <div class="flex-1 overflow-y-auto p-4 custom-scrollbar space-y-6">

        <!-- TAB 1: CONFIGURACION BASE -->
        <div id="tab-config" class="space-y-5">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Estructura Contenedor</label>
            <div class="grid grid-cols-3 gap-2">
              <button onclick="setContainerType('20std')" id="btn-20std" class="type-btn active p-2 border-2 border-amber-500 bg-amber-50 rounded-lg text-center transition">
                <div class="font-bold text-xs">20 FT STD</div>
                <div class="text-[10px] text-slate-500">6.0 x 2.4 x 2.6m</div>
              </button>
              <button onclick="setContainerType('20hc')" id="btn-20hc" class="type-btn p-2 border-2 border-slate-200 rounded-lg text-center transition hover:border-slate-300">
                <div class="font-bold text-xs">20 FT HC</div>
                <div class="text-[10px] text-slate-500">6.0 x 2.4 x 2.9m</div>
              </button>
              <button onclick="setContainerType('40hc')" id="btn-40hc" class="type-btn p-2 border-2 border-slate-200 rounded-lg text-center transition hover:border-slate-300">
                <div class="font-bold text-xs">40 FT HC</div>
                <div class="text-[10px] text-slate-500">12.0 x 2.4 x 2.9m</div>
              </button>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Color Pintura Exterior (RAL)</label>
            <div class="flex items-center space-x-2">
              <button onclick="setExteriorColor('#1e3a8a')" class="w-8 h-8 rounded-full bg-blue-900 border-2 border-white shadow hover:scale-110 transition"></button>
              <button onclick="setExteriorColor('#374151')" class="w-8 h-8 rounded-full bg-gray-700 border-2 border-white shadow hover:scale-110 transition"></button>
              <button onclick="setExteriorColor('#14532d')" class="w-8 h-8 rounded-full bg-green-900 border-2 border-white shadow hover:scale-110 transition"></button>
              <button onclick="setExteriorColor('#f8fafc')" class="w-8 h-8 rounded-full bg-slate-50 border-2 border-slate-300 shadow hover:scale-110 transition"></button>
              <button onclick="setExteriorColor('#991b1b')" class="w-8 h-8 rounded-full bg-red-800 border-2 border-white shadow hover:scale-110 transition"></button>
            </div>
          </div>
        </div>

        <!-- TAB 2: COLOCAR OBJETOS Y DIVISIONES -->
        <div id="tab-placement" class="space-y-4 hidden">
          <div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-900">
            <i class="fa-solid fa-magnet mr-1 font-bold"></i> <strong>Snapping Activado:</strong> Haz clic sobre el contenedor. Los tabiques se encajan solos de pared a pared a 90° y las ventanas/puertas se adhieren a los muros sin salir al exterior.
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Herramienta Activa de Inserción</label>
            <div class="grid grid-cols-1 gap-2">
              <button onclick="setActiveTool('window')" id="tool-btn-window" class="tool-btn p-2.5 text-left rounded-lg border-2 border-amber-500 bg-amber-50 text-xs font-semibold flex items-center justify-between">
                <span><i class="fa-solid fa-window-maximize mr-2 text-amber-600"></i> Ventana Termopanel</span>
                <span class="bg-slate-200 px-2 py-0.5 rounded text-[10px]" id="count-window">0</span>
              </button>

              <button onclick="setActiveTool('door')" id="tool-btn-door" class="tool-btn p-2.5 text-left rounded-lg border-2 border-slate-200 bg-white text-xs font-semibold flex items-center justify-between hover:border-slate-300">
                <span><i class="fa-solid fa-door-open mr-2 text-slate-600"></i> Puerta Peatonal Exterior</span>
                <span class="bg-slate-200 px-2 py-0.5 rounded text-[10px]" id="count-door">0</span>
              </button>

              <button onclick="setActiveTool('partition')" id="tool-btn-partition" class="tool-btn p-2.5 text-left rounded-lg border-2 border-slate-200 bg-white text-xs font-semibold flex items-center justify-between hover:border-slate-300">
                <span><i class="fa-solid fa-wall mr-2 text-slate-600"></i> Tabique Interior / División Transversal</span>
                <span class="bg-slate-200 px-2 py-0.5 rounded text-[10px]" id="count-partition">0</span>
              </button>

              <button onclick="setActiveTool('wc')" id="tool-btn-wc" class="tool-btn p-2.5 text-left rounded-lg border-2 border-slate-200 bg-white text-xs font-semibold flex items-center justify-between hover:border-slate-300">
                <span><i class="fa-solid fa-toilet mr-2 text-slate-600"></i> Batería / WC Sanitario</span>
                <span class="bg-slate-200 px-2 py-0.5 rounded text-[10px]" id="count-wc">0</span>
              </button>

              <button onclick="setActiveTool('ac')" id="tool-btn-ac" class="tool-btn p-2.5 text-left rounded-lg border-2 border-slate-200 bg-white text-xs font-semibold flex items-center justify-between hover:border-slate-300">
                <span><i class="fa-solid fa-wind mr-2 text-slate-600"></i> Aire Acondicionado Split</span>
                <span class="bg-slate-200 px-2 py-0.5 rounded text-[10px]" id="count-ac">0</span>
              </button>
            </div>
          </div>

          <button onclick="clearPlacedObjects()" class="w-full py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-xs rounded-lg transition">
            <i class="fa-solid fa-trash-can mr-1"></i> Limpiar Elementos Agregados
          </button>
        </div>

        <!-- TAB 3: TERMINACIONES Y MATERIALES SODIMAC -->
        <div id="tab-finishes" class="space-y-4 hidden">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Revestimiento Paredes (Sodimac)</label>
            <select id="select-lining" onchange="updateFinishConfig()" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-xs font-semibold focus:ring-2 focus:ring-amber-500">
              <option value="volcanita">Plancha Volcanita / Yeso Cartón 12.5mm STD</option>
              <option value="osb">Plancha Terciado / OSB Estructural 9mm</option>
              <option value="pvc">Panel PVC Revestimiento Lavable</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Aislamiento Térmico (Sodimac)</label>
            <select id="select-insulation" onchange="updateFinishConfig()" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-xs font-semibold focus:ring-2 focus:ring-amber-500">
              <option value="rockwool">Lana de Vidrio / Roca Rollo 50mm</option>
              <option value="eps">Aislapol EPS Poliestireno Expandido 50mm</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Piso Interior (Sodimac)</label>
            <select id="select-flooring" onchange="updateFinishConfig()" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-xs font-semibold focus:ring-2 focus:ring-amber-500">
              <option value="vinilico">Piso Vinílico LVT Clic Alto Tráfico</option>
              <option value="fl
